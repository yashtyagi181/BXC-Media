<footer class="bg-gradient-to-b from-background to-card/50 border-t border-border/30 relative overflow-hidden">
  <!-- Background Circles -->
  <div class="absolute top-0 left-0 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
  <div class="absolute bottom-0 right-0 w-80 h-80 bg-accent-glow/5 rounded-full blur-3xl"></div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <div class="py-16">
      <div class="grid lg:grid-cols-5 gap-12">
        <!-- Brand Column -->
        <div class="lg:col-span-2">

          <a routerLink="/" class="flex items-center mb-6 cursor-pointer">
            <img 
              src="assets/photos/logo.png" 
              alt="BXC Media Logo"
              class="w-14 h-16 object-contain"
            />

            <h3 class="text-3xl font-bold text-foreground">
              Bxc
              <span class="bg-gradient-to-r from-primary to-accent-glow bg-clip-text text-transparent">
                Media
              </span>
            </h3>
          </a>

          <p class="text-muted-foreground leading-relaxed text-lg mb-6">
            We help venture capital funds and tech companies scale content strategies through 
            professional podcast production and smart distribution.
          </p>
        

          <!-- Contact Info -->
          <div class="space-y-4 mb-8">
            <div class="flex items-center space-x-3">
              <span class="w-5 h-5 text-primary">📧</span>
              <span class="text-muted-foreground">BXCMedia</span>
            </div>
            <div class="flex items-center space-x-3">
              <span class="w-5 h-5 text-primary">📞</span>
              <span class="text-muted-foreground">+91 9999999999</span>
            </div>
            <div class="flex items-center space-x-3">
              <span class="w-5 h-5 text-primary">📍</span>
              <span class="text-muted-foreground">Rajasthan</span>
            </div>
          </div>

          <button class="bg-gradient-to-r from-primary to-accent-glow text-white font-semibold px-8 py-3 rounded-full transition-all duration-300 transform hover:scale-105"
          (click)="bookCall()">
            Start Your Podcast Journey
          </button>
        </div>

        <!-- Services Links -->
        <!-- <div>
          <h4 class="text-lg font-semibold text-foreground mb-6">Services</h4>

                {{ link.label }}
              </a>
            </li>
          </ul>
        </div> -->

        <!-- Company Links -->
        <div>
          <h4 class="text-lg font-semibold text-foreground mb-6">Company</h4>
          <ul class="space-y-3">
            <li *ngFor="let link of footerLinks.company">
              <a [href]="link.href" class="text-muted-foreground hover:text-primary transition duration-200 hover:underline">
                {{ link.label }}
              </a>
            </li>
          </ul>
        </div>

        <!-- Resources Links -->
        <!-- <div>
          <h4 class="text-lg font-semibold text-foreground mb-6">Resources</h4>

                {{ link.label }}
              </a>
            </li>
          </ul>
        </div> -->
      </div>
    </div>

    <!-- Bottom Footer -->
    <div class="py-8 border-t border-border/30">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="text-muted-foreground text-sm">
          © 2025 BxcMedia. All rights reserved.
        </div>

        <div class="flex items-center space-x-4">
          <a href="#" class="p-2 text-muted-foreground hover:text-primary hover:bg-primary/10 rounded-full">🔗</a>
          <a href="#" class="p-2 text-muted-foreground hover:text-primary hover:bg-primary/10 rounded-full">🐦</a>
        </div>

        <div class="flex items-center space-x-6 text-sm">

          <a routerLink="/terms" class="text-muted-foreground hover:text-primary">Terms of Service</a>

    <button
