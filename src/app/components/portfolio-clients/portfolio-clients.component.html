<section class="portfolio-section overflow-hidden py-20 bg-black">
  <div class="text-center mb-16">
    <h2 class="text-4xl font-bold text-white">
      Portfolio <span class="gradient-text">Clients</span>
    </h2>
  </div>

  <div class="relative w-full marquee">
    <!-- Scrolling wrapper -->
    <div
      class="marquee-track flex gap-20 whitespace-nowrap will-change-transform"
    >
      <!-- Duplicate for seamless looping -->
      <ng-container *ngFor="let repeat of [0, 1]">
        <div
          *ngFor="let client of clients"
          class="min-w-[200px] flex flex-col items-center group transition-transform duration-500"
        >
          <div class="w-28 h-28 flex items-center justify-center bg-white rounded-full mb-3 overflow-hidden">
            <img
              [src]="client.logo"
              [alt]="client.name"
              class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
            />
          </div>
          <h3 class="text-white font-semibold text-sm">{{ client.name }}</h3>
          <p class="text-gray-400 text-xs">{{ client.type }}</p>
        </div>
      </ng-container>
    </div>
  </div>
</section>
