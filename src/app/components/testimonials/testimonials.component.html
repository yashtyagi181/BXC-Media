<section
  #introSection
  class="max-w-5xl mx-auto px-6 py-10 md:py-14 text-center bg-black text-white transition-all duration-1000"
  [ngClass]="{
    'opacity-100 translate-y-0': introVisible,
    'opacity-0 translate-y-8': !introVisible,
  }"
>
  <h2
    class="text-3xl md:text-4xl font-bold mb-4 bg-gradient-to-r from-accent-glow via-primary to-accent-glow bg-clip-text text-transparent"
  >
    What This Means for You
  </h2>
  <p class="text-lg text-muted-foreground leading-relaxed">
    More inbound leads. Higher close rates. A brand that becomes unavoidable in
    your niche. Your content works for you 24/7 — attracting clients who already
    trust you.
  </p>
</section>

<section
  class="py-20 px-6 bg-gradient-to-b from-card/30 to-background relative overflow-hidden"
>
  <div
    class="absolute top-20 left-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl animate-pulse-slow"
  ></div>
  <div
    class="absolute bottom-20 right-20 w-48 h-48 bg-accent-glow/5 rounded-full blur-3xl animate-pulse-slow"
  ></div>

  <div class="max-w-6xl mx-auto relative z-10">
    <div class="text-center mb-16">
      <h2 class="text-4xl md:text-4xl font-bold text-foreground mb-4">
        Testimonials
      </h2>
      <p class="text-xl text-muted-foreground max-w-3xl mx-auto">
        See what industry leaders are saying about our services
      </p>
    </div>

    <!-- Scrolling Testimonial Gallery -->
    <div class="scroll-wrapper py-10 mb-16">
      <div
        class="scroll-track flex items-center gap-6"
        [style.--scroll-speed]="duplicatedImages.length * 3 + 's'"
      >
        <img
          *ngFor="let img of duplicatedImages"
          [src]="img"
          class="h-64 md:h-72 rounded-xl shadow-lg border border-border/30 object-cover"
        />
      </div>
    </div>

    <!-- Video Testimonials Deck -->
    <div #deckSection class="video-deck-section">
      <div class="video-deck-wrapper">
        <!-- Cards Container -->
        <div
          class="deck-container"
          (touchstart)="onTouchStart($event)"
          (touchend)="onTouchEnd($event)"
          (wheel)="onWheel($event)"
        >
          <div
            *ngFor="let t of testimonials; let i = index"
            class="video-card"
            [class.active]="i === currentIndex"
            [class.left]="i < currentIndex"
            [class.right]="i > currentIndex"
          >
            <!-- Video -->
            <div #videoPlayer class="youtube-testimonial-player"></div>

            <!-- Controls -->
            <div class="controls">
              <!-- Progress -->
              <div
                class="progress-bar"
                (click)="seek($event, i); $event.stopPropagation()"
                (mousedown)="startSeek($event, i)"
                (touchstart)="startSeek($event, i)"
              >
                <div class="progress-fill" [style.width.%]="t.progress"></div>
              </div>

              <!-- Buttons -->
              <div class="control-row">
                <button class="icon-btn" (click)="togglePlay(i)">
                  <span *ngIf="!t.playing">▶</span>
                  <span *ngIf="t.playing">❚❚</span>
                </button>

                <button class="icon-btn" (click)="toggleMute(i)">
                  <span *ngIf="t.muted">🔇</span>
                  <span *ngIf="!t.muted">🔊</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="deck-nav">
          <!-- PREV -->
          <button class="button prev" (click)="prev()">
            <div class="button-box">
              <span class="button-elem">
                <svg viewBox="0 0 46 40" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z"
                  />
                </svg>
              </span>

              <span class="button-elem">
                <svg viewBox="0 0 46 40" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z"
                  />
                </svg>
              </span>
            </div>
          </button>

          <!-- NEXT -->
          <button class="button next" (click)="next()">
            <div class="button-box">
              <span class="button-elem">
                <svg viewBox="0 0 46 40" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z"
                  />
                </svg>
              </span>

              <span class="button-elem">
                <svg viewBox="0 0 46 40" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z"
                  />
                </svg>
              </span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
